[project]
name = "pyorex-analytics"
version = "0.1.0"
description = "PyOrex — Python Analytics Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "polars>=1.0.0",
    "fastexcel>=0.11.5",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "factor-analyzer>=0.5.1",
    "asteval>=0.9.32",
    "pyarrow>=16.0.0",
    "pingouin>=0.5.4",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "pyproj>=3.6.0",
    "tifffile>=2024.1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "analysis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
"analysis.geochemistry" = ["references/*.json", "references/*.csv", "references/*.txt", "references/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
